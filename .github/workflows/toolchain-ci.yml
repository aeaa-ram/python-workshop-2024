name: calculation-knowledge-base tests

on:
  push:
    paths:
      - "structural-ai-toolchain/**"
      - ".github/workflows/toolchain-ci.yml"
  pull_request:
    paths:
      - "structural-ai-toolchain/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: structural-ai-toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Health check of the committed knowledge base
        run: python -m ckb health
