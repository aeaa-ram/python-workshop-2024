id: alpha_cw
name: Coefficient for the state of stress in the compression chord
formula: 1 if sigma_cp <= 0 else 1 + sigma_cp / f_cd if sigma_cp <= 0.25 * f_cd else 1.25 if sigma_cp <= 0.5 * f_cd
  else 2.5 * (1 - sigma_cp / f_cd)
params:
- sigma_cp
- f_cd
var: alpha_cw
symbol: α_{cw}
unit: '-'
code: EN 1992-1-1
topic: 6.2.3
topic_path:
- 6 Ultimate limit states (ULS)
- 6.2 Shear
- 6.2.3 Members requiring design shear reinforcement
clause: 6.2.3(3)
eq: (6.11aN) to (6.11cN)
basis: code
ndp: true
checks:
- when: sigma_cp < f_cd
  text: σ_cp must be below f_cd
  clause: 6.2.3(3)
