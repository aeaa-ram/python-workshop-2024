    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
- kind: guidance
  text: Check the maximum effective shear reinforcement (6.12) and the minimum shear reinforcement ratio (9.5N)
    with the same links.
  refs:
