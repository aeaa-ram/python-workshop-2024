background:
- kind: scope
  text: Vertical shear reinforcement. For inclined links use (6.13) with the angle α. The variable strut inclination
    method lets the designer choose θ within the limits; a flatter strut needs fewer links but increases the additional
    tensile force in the longitudinal reinforcement (6.2.3(7)).
