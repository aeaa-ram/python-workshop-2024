background:
- kind: limitation
  text: 'Table 3.1 gives two expressions: 0.30 f_ck^(2/3) up to C50/60 and 2.12 ln(1 + f_cm/10) above. Tensile strength
    scatters widely; use the 5 % fractile f_ctk,0.05 = 0.7 f_ctm where a low value is unfavourable.'
