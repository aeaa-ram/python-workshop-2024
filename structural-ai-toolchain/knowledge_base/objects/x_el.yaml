id: x_el
name: Depth of the neutral axis of the cracked section (elastic)
formula: (sqrt((alpha_e * A_s) ** 2 + 2 * b * alpha_e * A_s * d) - alpha_e * A_s) / b
params:
- alpha_e
- A_s
- b
- d
var: x_el
