id: N_b_Rd
name: Design buckling resistance of a compression member (class 1 to 3)
formula: chi * A_sec * f_y / gamma_M1
params:
- chi
- A_sec
- f_y
- gamma_M1
var: N_b_Rd
symbol: N_{b,Rd}
unit: kN
code: EN 1993-1-1
topic: 6.3.1
topic_path:
- 6 Ultimate limit states
- 6.3 Buckling resistance of members
- 6.3.1 Uniform members in compression
clause: 6.3.1.1(3)
eq: (6.47)
basis: code
sense: resistance
check: N_Ed
background:
- kind: guidance
  text: Buckling may be ignored and only the cross-section checked where λ̄ ≤ 0.2 or N_Ed/N_cr ≤ 0.04 (6.3.1.2(4)).
    Check both axes, each with its own buckling length and curve; torsional and torsional-flexural buckling (6.3.1.4)
    can govern for open sections with low torsional stiffness.
  refs:
  - id: EN1993-1-1
    at: 6.3.1.2(4), 6.3.1.4
    text: 'EN 1993-1-1:2005 + AC:2009 + A1:2014. Eurocode 3: Design of steel structures. Part 1-1: General rules
      and rules for buildings.'
- kind: limitation
  text: Members in compression only. Combined bending and compression needs the interaction factors of 6.3.3 (Annex
    A or B), which are not in this object.
  refs:
  - id: EN1993-1-1
    at: 6.3.3
    text: 'EN 1993-1-1:2005 + AC:2009 + A1:2014. Eurocode 3: Design of steel structures. Part 1-1: General rules
      and rules for buildings.'
