id: V_Rd_c
name: Shear resistance of a member without shear reinforcement
formula: max((C_Rd_c * k * (100 * rho_l * f_ck) ** (1 / 3) + k_1 * sigma_cp) * b_w * d, V_Rd_c_min)
params:
- C_Rd_c
- k
- rho_l
- f_ck
- k_1
- sigma_cp
- b_w
- d
- V_Rd_c_min
var: V_Rd_c
symbol: V_{Rd,c}
unit: kN
code: EN 1992-1-1
topic: 6.2.2
topic_path:
- 6 Ultimate limit states (ULS)
- 6.2 Shear
- 6.2.2 Members not requiring design shear reinforcement
clause: 6.2.2(1)
eq: (6.2.a), (6.2.b)
basis: code
sense: resistance
check: V_Ed
checks:
- when: sigma_cp <= 0.2 * f_cd
  text: σ_cp = N_Ed/A_c is limited to 0.2 f_cd
  clause: 6.2.2(1)
background:
- kind: scope
  text: 'Members in which no shear reinforcement is required by calculation: slabs, and beams that still receive
    minimum links. For beams, 6.2.1(4) requires minimum shear reinforcement (9.2.2) even when V_Ed ≤ V_Rd,c; slabs
    where loads can redistribute transversely may omit it.'
  refs:
  - id: EN1992-1-1
    at: 6.2.1(3), 6.2.1(4), 9.2.2
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
- kind: history
  text: The expression is empirical, calibrated on tests of members without shear reinforcement; C_Rd,c = 0.18/γ_C
    comes from a statistical evaluation of those tests. The second-generation EN 1992-1-1:2023 uses a different
    expression that includes the aggregate size, so objects from the two generations are kept apart.
  refs:
  - id: EC2-Commentary
    at: 6.2.2
    text: European Concrete Platform. Eurocode 2 Commentary. Brussels, 2008.
  - id: EN1992-1-1:2023
    at: 8.2.2
    text: 'EN 1992-1-1:2023. Eurocode 2: Design of concrete structures. Part 1-1 (second generation).'
- kind: pitfall
  text: 'Units: the bracket (100 ρ_l f_ck)^(1/3) is in MPa; per-metre calculations with b_w = 1000 mm give kN/m,
    not kN.'
  refs:
  - id: EN1992-1-1
    at: 6.2.2(1)
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
- kind: pitfall
  text: σ_cp is positive for compression. Axial tension makes k_1 σ_cp negative and reduces both expressions (6.2.a)
    and (6.2.b); leaving the term out in tension is unsafe.
  refs:
  - id: EN1992-1-1
    at: 6.2.2(1)
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
- kind: guidance
  text: For loads applied within 2d of a support, the contribution of the load to V_Ed may be reduced by β = a_v/2d
    (6.2.2(6)); this reduces the action, not V_Rd,c. V_Ed must still not exceed 0.5 b_w d ν f_cd (6.5).
  refs:
  - id: EN1992-1-1
    at: 6.2.2(6)
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
- kind: practice
  from: sources
  about: b_w
  text: 'Usually calculated per metre width in calculations of slabs, cantilevers: 80 of 86 source formulas work
    per metre (b_w = 1000 mm, results per metre). Every force in such a calculation must then be per metre too.'
  refs: []
version: 5b3fb119fcd5
