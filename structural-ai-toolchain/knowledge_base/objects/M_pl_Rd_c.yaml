id: M_pl_Rd_c
name: Plastic moment resistance of a composite beam, sagging, neutral axis in a solid slab
formula: N_pl_a * (h_a / 2 + h_c_fl - x_pl / 2)
params:
- N_pl_a
- h_a
- h_c_fl
- x_pl
var: M_pl_Rd_c
symbol: M_{pl,Rd}
unit: kNm
code: EN 1994-1-1
topic: '6.2'
topic_path:
- 6 Ultimate limit states
- 6.2 Resistances of cross-sections of beams
clause: 6.2.1.2(1)
basis: mechanics
sense: resistance
check: M_Ed
fixed:
  alpha_cc: 1.0
checks:
- when: N_pl_a <= N_c_f
  text: Plastic neutral axis in the concrete flange (N_pl,a ≤ N_c,f)
  clause: 6.2.1.2(1)
background:
- kind: limitation
  text: 'Full shear connection, a solid slab (no sheeting: with sheeting the lever arm grows by h_p and only the
    concrete above the ribs counts), a doubly symmetric steel section of class 1 or 2, and the neutral axis in the
    slab. With partial shear connection use 6.2.1.3.'
  refs:
  - id: EN1994-1-1
    at: 6.2.1.2, 6.2.1.3
    text: 'EN 1994-1-1:2004 + AC:2009. Eurocode 4: Design of composite steel and concrete structures. Part 1-1:
      General rules and rules for buildings.'
- kind: pitfall
  text: For S420 and S460 steel with x_pl/h > 0.15, M_pl,Rd is reduced by β (6.2.1.2(2)); this object does not apply
    it.
  refs:
  - id: EN1994-1-1
    at: 6.2.1.2(2), Figure 6.3
    text: 'EN 1994-1-1:2004 + AC:2009. Eurocode 4: Design of composite steel and concrete structures. Part 1-1:
      General rules and rules for buildings.'
version: 03e8008f8201
