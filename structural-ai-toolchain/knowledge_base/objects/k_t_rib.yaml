- 6.6.4 Headed studs used with profiled steel sheeting
clause: 6.6.4.2(1)
eq: (6.23)
basis: code
background:
- kind: limitation
  text: Ribs transverse to the beam, h_p ≤ 85 mm, b_0 ≥ h_p, stud diameter ≤ 20 mm through-deck welded (≤ 22 mm
    in holes), at most two studs per rib. P_Rd of the stud is multiplied by k_t.
