id: x
name: Depth of the neutral axis at the ultimate limit state
formula: A_s * f_yd / (eta * f_cd * lam * b)
params:
- A_s
- f_yd
- eta
- f_cd
- lam
- b
var: x
unit: mm
code: EN 1992-1-1
topic: '6.1'
topic_path:
- 6 Ultimate limit states (ULS)
- 6.1 Bending with or without axial force
clause: 3.1.7(3), 6.1
basis: mechanics
checks:
- when: x <= 0.0035 / (0.0035 + f_yd / E_s) * d
  text: the reinforcement yields (x/d within the limit for ε_cu3 = 3.5 ‰); otherwise the expression overstates the
    steel force
  clause: 3.1.7, 6.1(2)
background:
- kind: scope
  text: Rectangular section with tension reinforcement only, rectangular stress block of depth λx and stress η f_cd,
    steel yielding. For flanged sections the compression zone may lie in the flange or reach the web; compression
    reinforcement and axial force are not included.
  refs:
  - id: EN1992-1-1
    at: 3.1.7(3)
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
  - id: HowTo-EC2
    at: Beams
    text: The Concrete Centre. How to design concrete structures using Eurocode 2. 2006 and later editions.
- kind: guidance
  text: Where moment redistribution or plastic analysis is used, x/d is further limited (5.5, 5.6.3) to ensure rotation
    capacity.
  refs:
  - id: EN1992-1-1
    at: 5.5(4), 5.6.3(2)
    text: 'EN 1992-1-1:2004 + AC:2010 + A1:2014. Eurocode 2: Design of concrete structures. Part 1-1: General rules
      and rules for buildings.'
