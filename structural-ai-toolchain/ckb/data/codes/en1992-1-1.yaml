  # ---- 4.4.1 cover ----
  - id: dc_dev
    symbol: "Δc_{dev}"
    name: Allowance in design for deviation (cover)
    topic: "4.4"
    clause: "4.4.1.3(1)"
    kind: coefficient
    ndp: true
    value: 10
    unit: mm
    range: [0, 15]
    aliases: [Δcdev, dc_dev, delta_c_dev]
  - id: c_min
    symbol: "c_{min}"
    name: Minimum cover
    topic: "4.4"
    clause: "4.4.1.2(2)"
    eq: "(4.2)"
    kind: derived
    basis: code
    unit: mm
    range: [10, 80]
    formula: max(phi_bar, c_min_dur, 10)
    aliases: [cmin, c_min]
    background:
      - kind: limitation
        text: "Written with the additive terms Δc_dur,γ, Δc_dur,st and Δc_dur,add at their recommended value 0. c_min,b is the bar diameter for separated bars; for bundled bars use the equivalent diameter, and increase it by 5 mm if the nominal aggregate size exceeds 32 mm."
        refs: ["EN1992-1-1:4.4.1.2(3), Table 4.2"]
  - id: cover_nom
    symbol: "c_{nom}"
    name: Nominal cover
    topic: "4.4"
    clause: "4.4.1.1(2)"
    eq: "(4.1)"
    kind: derived
    basis: code
    unit: mm
    range: [15, 100]
    formula: c_min + dc_dev
    aliases: [cover_nom]
    words: [nominal cover]
    background:
      - kind: pitfall
        text: "The cover shown on drawings is c_nom; the minimum c_min is the value that must be achieved on site. Δc_dev may be reduced where quality control measures the cover (4.4.1.3(3))."
        refs: ["EN1992-1-1:4.4.1.3"]

  # ---- 5.3.2.1 effective flange width ----
  - id: b_eff
    symbol: "b_{eff}"
    name: Effective width of a T-beam flange
    topic: "5.3"
    clause: "5.3.2.1(3)"
    eq: "(5.7), (5.7a), (5.7b)"
    kind: derived
    basis: code
    unit: mm
    range: [100, 12000]
    formula: min(min(0.2 * b_1 + 0.1 * l_0_b, 0.2 * l_0_b, b_1) + min(0.2 * b_2 + 0.1 * l_0_b, 0.2 * l_0_b, b_2) + b_w, b_fl)
    aliases: [beff, b_eff]
    words: [effective flange width, effective width]
    background:
      - kind: guidance
        text: "l_0 is the distance between points of zero moment; Figure 5.2 gives it from the spans (0.85 l_1 in an end span, 0.70 l_2 in an internal span, 0.15 (l_1 + l_2) over a support)."
        refs: ["EN1992-1-1:5.3.2.1(2), Figure 5.2"]

  # ---- 5.8.3.1 slenderness ----
  - id: i_c
    symbol: "i"
    name: Radius of gyration of the uncracked concrete section
    topic: "5.8"
    clause: "5.8.3.2(1)"
    kind: derived
    basis: definition
    unit: mm
    range: [20, 2000]
    formula: sqrt(I_conc / A_c)
    aliases: [i_c]
  - id: lambda_c
    symbol: "λ"
    name: Slenderness ratio of the column
    topic: "5.8"
    clause: "5.8.3.2(1)"
    eq: "(5.14)"
    kind: derived
    basis: code
    unit: "-"
    range: [5, 200]
    formula: l_0 / i_c
    aliases: [lambda_c]
    words: [slenderness ratio]
  - id: n_rel
    symbol: "n"
    name: Relative normal force
    topic: "5.8"
    clause: "5.8.3.1(1)"
    kind: derived
    basis: code
    unit: "-"
    range: [0.01, 1.5]
    formula: N_Ed / (A_c * f_cd)
    aliases: [n_rel]
    words: [relative normal force, relative axial force]
  - {id: A_phi, symbol: "A", name: "Factor A for creep (1/(1 + 0.2 φ_ef))", topic: "5.8", clause: "5.8.3.1(1)", kind: coefficient, value: 0.7, unit: "-", range: [0.5, 1.0], aliases: [A_phi]}
  - {id: B_omega, symbol: "B", name: "Factor B for the mechanical reinforcement ratio (√(1 + 2ω))", topic: "5.8", clause: "5.8.3.1(1)", kind: coefficient, value: 1.1, unit: "-", range: [1.0, 2.0], aliases: [B_omega]}
  - {id: C_rm, symbol: "C", name: "Factor C for the moment ratio (1.7 − r_m)", topic: "5.8", clause: "5.8.3.1(1)", kind: coefficient, value: 0.7, unit: "-", range: [0.7, 2.7], aliases: [C_rm]}
  - id: lambda_lim
    symbol: "λ_{lim}"
    name: Slenderness below which second order effects may be ignored
    topic: "5.8"
    clause: "5.8.3.1(1)"
    eq: "(5.13N)"
    kind: derived
    basis: code
    ndp: true
    unit: "-"
    range: [5, 200]
    formula: 20 * A_phi * B_omega * C_rm / sqrt(n_rel)
    aliases: [λlim, lambda_lim]
    words: [limiting slenderness]
    background:
      - kind: guidance
        text: "Second order effects may be ignored if λ ≤ λ_lim. A = 0.7, B = 1.1 and C = 0.7 are the values to use when φ_ef, ω and r_m are not known; C = 0.7 is conservative for most members, but r_m = −1 (double curvature) gives C = 2.7."
        refs: ["EN1992-1-1:5.8.3.1(1)"]
      - kind: pitfall
        text: "A low axial force gives a high λ_lim: (5.13N) is not meant for very small n, and some National Annexes set a minimum. Check the National Annex for (5.13N)."
        refs: ["EN1992-1-1:5.8.3.1(1)", "DG-EC2:5.8"]

  # ---- 6.2.3 shear reinforcement: inclined links, limits ----
  - id: V_Rd_s_a
