    aliases: [Ec.eff, "Ec,eff", Eceff, E_c.eff, E_c.long, Ec.long, Eclong]
    words: [effective modulus, long e-modulus, long term e-modulus, long-term modulus]

  # =================================================================================================
  # Added for a fuller baseline.  Written from the code, not yet seen in a source and not yet
  # compared with an independent implementation: they start as "not yet checked".
  # =================================================================================================
  # ---- 3.1 materials ----
  - id: f_ctk_095
    symbol: "f_{ctk,0.95}"
