# Code baseline: EN 1994-1-1 (Eurocode 4), a first set of clauses, recommended values.
#
# Same format as en1992-1-1.yaml.  Quantities this code shares with another code are not
# defined twice:
#
#   same_as: <id>      the code uses an existing object unchanged (here: E_cm from EN 1992-1-1)
#   formula only       the registry compares it with every existing object.  If it is the same
#                      expression (f_sd = f_sk/γ_S is EN 1992-1-1 f_yd) it becomes a reference to
#                      that object; if it is a special case (f_cd = f_ck/γ_C is EN 1992-1-1 f_cd
#                      with α_cc = 1) the object is shared and this code fixes the parameter.
#                      Only a genuinely different expression becomes a new object.

code: EN 1994-1-1
title: "Eurocode 4: Design of composite steel and concrete structures, Part 1-1"
edition: "2004 + AC:2009"
values: recommended values (no National Annex)
order: 2

topics:
  - {id: "2.4",   title: "Verification by the partial factor method"}
  - {id: "3.1",   title: "Concrete"}
  - {id: "6",     title: "Ultimate limit states", keywords: [uls, ultimate]}
  - {id: "6.6",   title: "Shear connection", keywords: [shear connection, shear connector, stud]}
  - {id: "6.6.3", title: "Headed stud connectors in solid slabs and concrete encasement", keywords: [headed stud, stud]}
  - {id: "6.7",   title: "Composite columns and composite compression members", keywords: [composite column]}
  - {id: "6.7.3", title: "Simplified method of design"}

quantities:
  - id: f_cd
    name: Design compressive strength of concrete
    topic: "2.4"
    clause: "2.4.1.2(2)"
    kind: derived
    formula: f_ck / gamma_C
  - id: f_sd
    symbol: "f_{sd}"
    name: Design yield strength of reinforcing steel
    topic: "2.4"
    clause: "2.4.1.2(3)"
    kind: derived
    formula: f_yk / gamma_S
  - id: E_cm
    topic: "3.1"
    clause: "3.1(1)"
    same_as: E_cm
  - id: gamma_M0
    symbol: "γ_{M0}"
    name: Partial factor for resistance of cross-sections of structural steel
    topic: "2.4"
    clause: "2.4.1.2(4)"
    kind: coefficient
    ndp: true
    value: 1.0
    unit: "-"
    range: [1.0, 1.1]
    aliases: [γM0, γ_M0, gamma_M0, γa, γ_a]
    background:
      - kind: guidance
        text: "EN 1994-1-1 takes γ_a = γ_M0 from EN 1993-1-1; the recommended value there is 1.0."
        refs: ["EN1994-1-1:2.4.1.2"]
  - id: f_yd_a
    symbol: "f_{yd}"
    name: Design yield strength of structural steel
    topic: "2.4"
    clause: "2.4.1.2(4)"
    kind: derived
    basis: code
    unit: MPa
    range: [235, 460]
    formula: f_y / gamma_M0
    sense: resistance
    aliases: [fyd.a, f_yd.a, fyda]
  - id: gamma_V
    symbol: "γ_{V}"
    name: Partial factor for design shear resistance of a headed stud
    topic: "6.6.3"
    clause: "6.6.3.1(1)"
    kind: coefficient
    ndp: true
    value: 1.25
    unit: "-"
    range: [1.0, 1.5]
    aliases: [γV, γ_V, gamma_V, gammav]

  # ---- 6.6.3 headed studs ----------------------------------------------------------
  - id: alpha_stud
    symbol: "α"
    name: Factor for the stud height in the concrete failure mode
    topic: "6.6.3"
    clause: "6.6.3.1(1)"
    eq: "(6.20), (6.21)"
    kind: derived
    basis: code
    unit: "-"
    range: [0.8, 1.0]
    formula: min(0.2 * (h_sc / d_s + 1), 1)
    aliases: [α_stud, alpha_stud]
    checks:
      - when: "h_sc >= 3 * d_s"
        text: "h_sc/d ≥ 3"
        clause: "6.6.3.1(1)"
  - id: P_Rd_s
    symbol: "P_{Rd,s}"
    name: Design shear resistance of a headed stud, failure of the shank
    topic: "6.6.3"
    clause: "6.6.3.1(1)"
    eq: "(6.18)"
    kind: derived
    basis: code
    unit: kN
    range: [30, 200]
    formula: 0.8 * f_u * pi * d_s ** 2 / 4 / gamma_V
    sense: resistance
    aliases: [PRd.s, "PRd,s", P_Rd.s]
    checks:
      - when: "f_u <= 500"
        text: "f_u is limited to 500 N/mm²"
        clause: "6.6.3.1(1)"
  - id: P_Rd_c
    symbol: "P_{Rd,c}"
    name: Design shear resistance of a headed stud, failure of the concrete
    topic: "6.6.3"
    clause: "6.6.3.1(1)"
    eq: "(6.19)"
    kind: derived
    basis: code
    unit: kN
    range: [30, 200]
    formula: 0.29 * alpha_stud * d_s ** 2 * sqrt(f_ck * E_cm) / gamma_V
    sense: resistance
    aliases: [PRd.c, "PRd,c", P_Rd.c]
  - id: P_Rd
    symbol: "P_{Rd}"
    name: Design shear resistance of a headed stud in a solid slab
    topic: "6.6.3"
    clause: "6.6.3.1(1)"
    eq: "(6.18), (6.19)"
    kind: derived
    basis: code
    unit: kN
    range: [30, 200]
    formula: min(P_Rd_s, P_Rd_c)
    sense: resistance
    aliases: [PRd, P_Rd]
    words: [stud resistance, shear stud resistance, resistance of a headed stud]
    checks:
      - when: "16 <= d_s <= 25"
        text: "16 mm ≤ d ≤ 25 mm"
        clause: "6.6.3.1(1)"
    background:
      - kind: scope
        text: "Automatically welded headed studs in a solid slab or concrete encasement. In profiled steel sheeting the resistance is reduced by k_l or k_t (6.6.4)."
        refs: ["EN1994-1-1:6.6.3.1, 6.6.4"]
      - kind: guidance
        text: "The concrete properties f_ck and E_cm are those of EN 1992-1-1; this object uses the same E_cm as the concrete objects."
        refs: ["EN1994-1-1:3.1(1)"]

  # ---- 6.7.3 composite columns -----------------------------------------------------
  - id: N_pl_Rd
    symbol: "N_{pl,Rd}"
    name: Plastic resistance to compression of a composite cross-section
    topic: "6.7.3"
    clause: "6.7.3.2(1)"
    eq: "(6.30)"
    kind: derived
    basis: code
    unit: kN
    range: [500, 50000]
    formula: A_a * f_yd_a + 0.85 * A_c * f_cd + A_s * f_sd
    sense: resistance
    check: N_Ed
    aliases: [Npl.Rd, "Npl,Rd", NplRd, N_pl.Rd]
    words: [plastic resistance to compression, squash load]
    background:
      - kind: scope
        text: "Concrete-encased and partially encased sections. For concrete-filled sections the coefficient 0.85 may be replaced by 1.0, and circular filled tubes may use the confinement effect (6.33)."
        refs: ["EN1994-1-1:6.7.3.2(1), (6.33)"]
      - kind: pitfall
        text: "f_cd here is f_ck/γ_C without α_cc; the reduction to 0.85 is in the expression itself. Using an EN 1992-1-1 f_cd with α_cc = 0.85 would apply it twice."
        refs: ["EN1994-1-1:2.4.1.2, 6.7.3.2", "DG-EC4:6.7"]
