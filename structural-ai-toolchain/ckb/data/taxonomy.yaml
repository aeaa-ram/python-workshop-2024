# Taxonomy seed: the clause structure of the design code and its notation.
#
# This file holds NO formulas.  It says which quantities the code defines
# (symbol, clause, customary unit) and how engineers spell them.  The logic
# itself is distilled from the source calculations.
#
#   kind: derived      the code defines the quantity by an expression -> a calculation object
#         input        geometry, material grade, action -> a parameter; formulas found for it
#                      in a source are project-specific and are not distilled
#         coefficient  a code or National Annex value -> a parameter with a typical value
#   aliases            spellings met in calculations (separators and case of subscripts are
#                      ignored when matching: V_Rd,c = VRd.c = V_Rd.c)
#   words              phrases in a descriptive label that identify the quantity
#   unit               customary unit; used when a source states no unit
#   range              sensible range in the customary unit (for numerical comparison of variants)

