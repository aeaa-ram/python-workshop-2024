  - {id: I_a, symbol: "I_{a}", name: Second moment of area of the structural steel section, kind: input, unit: cm⁴, range: [100, 5000000], example: 23130, aliases: [Ia, I_a]}
  - {id: I_s, symbol: "I_{s}", name: Second moment of area of the reinforcement, kind: input, unit: cm⁴, range: [0, 1000000], example: 1000, aliases: [Is, I_s]}
